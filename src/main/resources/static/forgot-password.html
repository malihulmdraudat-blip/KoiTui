<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Koi Tui - Reset Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <img src="images/logo.png" alt="Koi Tui logo" style="height:80px; display:block; margin:0 auto 12px; border-radius:50%;">
      <h1>Reset Password</h1>
      <p class="subtitle">Verify your identity to set a new password</p>

      <form id="forgotPasswordForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="you@university.edu">
        </div>
        <div class="form-group">
          <label for="studentId">Student ID</label>
          <input type="text" id="studentId" required placeholder="e.g. 2021-1-60-002">
        </div>
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" required placeholder="At least 6 characters" minlength="6">
        </div>
        <button type="submit" class="btn">Reset Password</button>
        <p class="error-msg" id="errorMsg"></p>
        <p class="success-msg" id="successMsg"></p>
      </form>

      <p class="form-footer"><a href="index.html">Back to Log In</a></p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/forgot-password.js"></script>
</body>
</html>
