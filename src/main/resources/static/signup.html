<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Koi Tui - Sign Up</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <h1>Create Account</h1>
      <p class="subtitle">Join Koi Tui to plan hangouts easily</p>

      <form id="signupForm">
        <div class="form-group">
          <label for="studentId">Student ID</label>
          <input type="text" id="studentId" required placeholder="e.g. 2021-1-60-001">
        </div>
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" required placeholder="Your name">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="you@university.edu">
        </div>
        <div class="form-group">
          <label for="semester">Semester</label>
          <input type="text" id="semester" placeholder="e.g. Spring 2026">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="Choose a password">
        </div>
        <button type="submit" class="btn">Sign Up</button>
        <p class="error-msg" id="errorMsg"></p>
      </form>

      <p class="form-footer">Already have an account? <a href="index.html">Log in</a></p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
