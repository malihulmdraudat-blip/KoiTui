<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Koi Tui - Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <img src="images/logo.png" alt="Koi Tui logo" style="height:80px; display:block; margin:0 auto 12px; border-radius:50%;">
      <h1>Koi Tui</h1>
      <p class="subtitle">Find common free periods with friends</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="you@university.edu">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="Your password">
        </div>
        <button type="submit" class="btn">Log In</button>
        <p class="error-msg" id="errorMsg"></p>
      </form>

      <p class="form-footer">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
