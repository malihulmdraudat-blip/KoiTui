# ---- Server ----
# Most hosting platforms (Railway, Render, etc.) inject a PORT env var - fall back to 8080 locally
server.port=${PORT:8080}

# ---- PostgreSQL ----
# Locally, these fall back to the values after the colon (:).
# On a hosting platform, set DB_URL / DB_USERNAME / DB_PASSWORD as environment variables instead -
# never put real production credentials in this file once it's in a public repo.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/freeslot_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Messi.1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---- JWT ----
# Set JWT_SECRET as an environment variable in production. Locally it falls back to the value below.
jwt.secret=${JWT_SECRET:ChangeThisToALongRandomSecretKeyForFreeSlotProject123456}
jwt.expiration.ms=86400000
